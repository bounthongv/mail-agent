# Scheduling
schedule:
  enabled: true
  interval_hours: 1

# AI Settings
ai:
  provider: "nvidia"
  model: "meta/llama-3.1-8b-instruct"
  max_tokens: 300
  temperature: 0.3

# Local AI / Notebook Settings
localai:
  enabled: false
  provider: "ollama"
  # Primary: Windows Server (Fastest)
  model: "llama3.2:3b"
  url: "http://209.126.1.13:11434/api/generate"

  # Secondary: Ubuntu Server (Fallback)
  secondary_url: "http://202.137.147.5:11434/api/generate"
  secondary_model: "gemma3:4b"

# Report Settings
report:
  daily_summary: true
  max_emails_per_report: 20
